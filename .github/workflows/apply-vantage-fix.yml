name: Apply VANTAGE theme and margin fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply fix
        run: |
          test -f apply_vantage_fix_20260812.mjs
          node apply_vantage_fix_20260812.mjs .

      - name: Validate frontend JavaScript
        run: |
          node --check public/theme-fixes-v72.js

      - name: Run Worker tests
        working-directory: worker
        run: |
          npm test
          npm run check

      - name: Remove temporary helper files
        run: |
          rm -f apply_vantage_fix_20260812.mjs
          rm -f apply_vantage_fix_20260812.ps1
          rm -f vantage_theme_margin_fix_20260812.patch

      - name: Verify diff
        run: git diff --check

      - name: Commit applied fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix theme classification and JP margin refresh"
          git push origin HEAD:main
